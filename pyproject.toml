[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keysigil"
version = "0.1.1"
description = "Embeddable API key management SDK with LLM token budget tracking. Drop-in library for key lifecycle, rate limiting, and token budgets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "keysigil contributors" }]
keywords = ["api-keys", "authentication", "rate-limiting", "llm", "token-budget", "api-key-management", "sdk", "keysigil"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29.0"]
redis = ["redis>=5.0.0"]
cli = ["typer>=0.12.0", "rich>=13.0.0"]
mcp = ["mcp>=1.0.0"]
fastapi = ["fastapi>=0.100.0"]
all = [
    "keysigil[postgres]",
    "keysigil[redis]",
    "keysigil[cli]",
    "keysigil[mcp]",
    "keysigil[fastapi]",
]
dev = [
    "keysigil[all]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.scripts]
keysigil = "keysigil.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/keysigil"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
